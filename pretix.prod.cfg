# Production Pretix configuration.
# Mounted into the container at /etc/pretix/pretix.cfg by docker-compose.prod.yml.
# Reference: https://docs.pretix.eu/en/latest/self-hosting/config/
#
# SECRETS DO NOT LIVE IN THIS FILE. DB user/password, Stripe keys, SMTP
# credentials come from infra/pretix/pretix.env on the VPS (PRETIX_* env vars
# override cfg values in the pretix/standalone image). pretix.env lives
# server-side under /srv/apps/selfstub/secrets/ and is gitignored — the deploy
# job never copies env files. The public URL and mail-from below can also be
# overridden there (PRETIX_PRETIX_URL / PRETIX_MAIL_FROM) without editing this
# file.
#
# The committed dev config (./pretix.cfg, debug=on, weak DB creds, console
# mail) must never be mounted in production.

[pretix]
instance_name = Selfstub Tickets
url = https://tickets.selfstub.com
currency = GBP
; DO NOT change the following value — it is the data dir *inside* the container.
datadir = /data
; The Caddy edge proxy terminates TLS and forwards Host / X-Forwarded-Proto —
; Pretix must trust them to build correct absolute URLs (order emails,
; Stripe redirect/callback URLs).
trust_x_forwarded_for = on
trust_x_forwarded_proto = on
; No public self-service organizer accounts — tenants are onboarded via the
; apps/cli onboarding CLI only. Keeps organizer creation admin-controlled.
registration = off

; No [django] debug section — production default (off).

[database]
backend = postgresql
name = pretix
host = postgres
; user / password come from PRETIX_DATABASE_USER / PRETIX_DATABASE_PASSWORD
; in pretix.env (server-side secrets, never committed).

[redis]
location = redis://redis:6379/0
sessions = true

[celery]
; Redis DB 1 for the broker (DB 0 is cache/sessions). Without this, Celery
; defaults to RabbitMQ (amqp://), which is not in the stack.
broker = redis://redis:6379/1
backend = redis://redis:6379/1

[mail]
; Sender address only — SMTP host/credentials via PRETIX_MAIL_* in pretix.env.
; The dev console backend is not allowed here: buyers must actually receive
; their PDF/QR tickets by email.
from = tickets@selfstub.com
