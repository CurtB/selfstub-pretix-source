# Pretix configuration file (INI format, read by Python configparser).
# Mounted into the container at /etc/pretix/pretix.cfg.
# Reference: https://docs.pretix.eu/en/latest/self-hosting/config/
#            https://docs.pretix.eu/en/latest/self-hosting/installation/docker_smallscale/

[pretix]
instance_name = Events Platform (dev)
url = http://localhost:8345
currency = GBP
; DO NOT change the following value — it is the data dir *inside* the container.
datadir = /data
trust_x_forwarded_for = on
trust_x_forwarded_proto = on

[django]
; Dev only: allows Docker-internal hostnames (e.g. "pretix") to reach the API.
; In production, remove this section and set the real SITE_URL above.
debug = on

[database]
backend = postgresql
name = pretix
user = cms
password = cms
host = postgres

[redis]
location = redis://redis:6379/0
sessions = true

[celery]
; Use Redis DB 1 for the Celery broker (DB 0 is used for cache/sessions above).
; Without this, Celery defaults to RabbitMQ (amqp://) which is not in the stack.
broker = redis://redis:6379/1
backend = redis://redis:6379/1

[mail]
from = tickets@localhost
; console backend for dev — prints emails to stdout
; smtp_host = localhost
; smtp_port = 25
